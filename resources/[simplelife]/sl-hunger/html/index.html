<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud" class="hud">
    <div class="stat" data-stat="hunger">
      <span class="stat-icon">🍖</span>
      <span class="stat-val" id="val-hunger">--</span>
    </div>
    <div class="stat" data-stat="thirst">
      <span class="stat-icon">💧</span>
      <span class="stat-val" id="val-thirst">--</span>
    </div>
    <div class="stat" data-stat="stamina">
      <span class="stat-icon">🏃</span>
      <span class="stat-val" id="val-stamina">--</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
