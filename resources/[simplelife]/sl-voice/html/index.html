<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="voice-hud" class="voice-hud" data-mode="normal">
    <div class="voice-icon" id="voice-icon">🗣️</div>
    <div class="voice-meta">
      <div class="voice-label" id="voice-label">Normal</div>
      <div class="voice-distance"><span id="voice-distance">8</span><span class="voice-unit">m</span></div>
    </div>
    <div class="voice-pulse"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
